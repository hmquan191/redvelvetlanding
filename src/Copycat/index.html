<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Red Velvet - Cosmic Velvet: A symphony of elegance and dissonance."

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Primary Fonts -->

      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;700&family=Dancing+Script:wght@400;700&family=Anton&family=Abril+Fatface&family=Permanent+Marker&family=Roboto+Slab:wght@400;700&family=Pacifico&family=Oswald:wght@400;700&family=Lobster&family=Shadows+Into+Light&family=Monoton&family=Righteous&family=Bangers&family=Creepster&family=Gloria+Hallelujah&display=swap"

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            serif: ["Playfair Display", "serif"],
          },
          extend: {
            colors: {
              "rv-irene": "#C21E56",
              "rv-seulgi": "#EEB211",
              "rv-wendy": "#0070B8",
              "rv-joy": "#32CD32",
              "rv-yeri": "#6C3082",
              pearl: "#F3F4F6",
              "deep-space": "#0f172a",
            },
            backgroundImage: {
              shimmer:
                "linear-gradient(45deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 60%)",
            },
            animation: {
              "float-slow": "float 8s ease-in-out infinite",
              "float-delayed": "float 8s ease-in-out 4s infinite",
              "pulse-subtle": "pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "shimmer-slide": "shimmer 3s infinite linear",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-15px)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
            },
          },
        },
      };
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/intro.css" />

    <!-- Fan Intro Overlay (Hidden initially) -->

      <div

        <!-- Cards will be injected here or hardcoded -->
        <div

            --translate: -200px;
            z-index: 1;

        ></div>

            z-index: 2;

        ></div>

            --translate: 0px;
            z-index: 3;

    <!-- HERO SECTION -->

          <span class="block mt-[-0.2em]">Velvet</span>
        </h1>

        </p>
        <!-- new section,  -->
        <a

            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"

            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </a>
      </div>

    <!-- CAROUSEL SECTION - Fairy Tape Recorder -->

      <!-- Magical Background Glow -->

        <div class="stardust stardust-2"></div>
        <div class="stardust stardust-3"></div>

          <svg
            class="w-4 h-4 text-yellow-200/80 animate-twinkle-delayed"
            viewBox="0 0 24 24"
            fill="currentColor"

            <polygon

          <!-- Right Crescent Moon (mirrored) -->

            class="w-6 h-6 text-pink-300/60 animate-pulse transform scale-x-[-1]"

            fill="currentColor"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </div>
        <p
          class="text-xs tracking-[0.3em] uppercase text-pink-200/40 font-light"
        >
          <!-- ✧ magical moments ✧ -->
        </p>
      </div>
